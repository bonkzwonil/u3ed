[project]
name = "u3edit"
version = "0.1.0"
description = "Ultima III (DOS) savegame editor with a terminal UI"
readme = "README.md"
authors = [
    { name = "bonkzwonil", email = "bonkzwonil@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
u3edit = "u3edit:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
